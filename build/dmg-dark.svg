<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="864" viewBox="0 0 640 432">
  <!-- The dmg's window, dark: the picture behind the two icons, in the app icon's browns (build/icon.svg).
       `npm run dmg:art` cuts dmg-dark.png and dmg-dark@2x.png from it with sips, so it holds only what sips draws: no
       filters, no tspans, Helvetica. The Finder puts the app at (166, 214) and the Applications folder at (474, 214),
       120 px each (electron-builder.yml), and writes their names under them in black, whatever the picture and whether
       the system is light or dark: on this dark picture each name has a light plate to stand on. The window is 432 px
       high with its title bar, so the picture's lowest 36 px or so are never seen, and nothing is drawn there. -->
  <rect width="640" height="432" fill="#130c07"/>
  <!-- The icon's rings, going on past it. -->
  <circle cx="238.5" cy="159" r="690" fill="#150d08"/>
  <circle cx="224.3" cy="169.9" r="575" fill="#180f09"/>
  <circle cx="211.2" cy="179.8" r="470" fill="#1b110a"/>
  <circle cx="199.5" cy="188.9" r="375" fill="#1f130b"/>
  <circle cx="188.9" cy="196.9" r="290" fill="#23160c"/>
  <circle cx="179.6" cy="204.1" r="215" fill="#28190d"/>
  <circle cx="171.6" cy="210.2" r="150" fill="#2e1c0e"/>
  <circle cx="164.9" cy="215.4" r="96" fill="#35200f"/>
  <text x="58.5" y="41" fill="#f6e7d3" font-family="Helvetica" font-size="15" font-weight="700" text-anchor="end">Opt</text>
  <text x="59" y="41" fill="#f6e7d3" font-family="Helvetica" font-size="15">Chat</text>
  <text x="320" y="104" fill="#f6e7d3" font-family="Helvetica" font-size="23" font-weight="700" text-anchor="middle">Drag OptChat into Applications.</text>
  <path d="M262 207Q320 181 378 207M365.5 193.5L378 207L359.5 211.5" stroke="#f79a2a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The plates the two names stand on. -->
  <rect x="126" y="279" width="80" height="22" rx="11" fill="#f3dcb4"/>
  <rect x="418" y="279" width="112" height="22" rx="11" fill="#f3dcb4"/>
  <text x="320" y="352" fill="#a58a72" font-family="Helvetica" font-size="12" text-anchor="middle">Then open it from Applications.</text>
</svg>
