# The macOS app: Electron around dist/ (the page, and the main process with the server bundled in). `npm run dist`.
appId: com.jonaslsaa.optchat
productName: OptChat
directories:
  output: release
# Everything the app runs is in dist: no node_modules go in. The icon is build/icon.icns, where it is looked for.
files:
  - dist/ui
  - dist/desktop
  - package.json
  - "!node_modules"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: arm64
  # Signed ad hoc: there is no Developer ID. Not signed at all, an arm64 app does not start. The hardened runtime is for
  # notarization, which needs one, and ad hoc it would refuse Electron's own libraries.
  identity: "-"
  hardenedRuntime: false
# Nothing updates itself, so nothing needs a block map.
dmg:
  writeUpdateInfo: false
