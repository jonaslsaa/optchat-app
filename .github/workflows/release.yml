name: Release

# Builds the macOS app (Apple Silicon) and attaches its dmg to a GitHub release. A tag `v<version>` releases; a run started by
# hand only builds, and keeps the dmg as an artifact of the run. Nothing builds on a push or a pull request: a macOS runner's
# minutes count ten times in a private repository.
on:
  push:
    tags: ['v*']
    branches: [feature/release-dmg] # Only to try the workflow before it is on main: taken out again before this merges.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: The tag is the version in package.json
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json says $version."
            exit 1
          fi
      - run: npm ci
      - run: npm run dist
      # Signed ad hoc: there is no Developer ID. This fails the build if the app is not signed at all, which macOS would not start.
      - name: The app's signature
        run: |
          codesign --verify --deep --strict release/mac-arm64/OptChat.app
          codesign -dv release/mac-arm64/OptChat.app
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg --generate-notes --verify-tag
      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: OptChat-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 7
