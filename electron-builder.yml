# The macOS app: Electron around dist/ (the page, and the main process with the server bundled in). `npm run dist`.
appId: com.jonaslsaa.optchat
productName: OptChat
directories:
  output: release
# Everything the app runs is in dist: no node_modules go in. The icon is build/icon.icns, where it is looked for.
files:
  - dist/ui
  - dist/desktop
  - package.json
  - "!node_modules"
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: arm64
  # Signed ad hoc: there is no Developer ID. Not signed at all, an arm64 app does not start. The hardened runtime is for
  # notarization, which needs one, and ad hoc it would refuse Electron's own libraries.
  identity: "-"
  hardenedRuntime: false
# The app updates itself from a zip of the app that the release workflow makes, not through electron-builder's updater
# (docs/desktop.md), so nothing needs a block map.
dmg:
  writeUpdateInfo: false
  # The window the app is dragged out of. Its picture is build/background.png, where electron-builder looks for it, with
  # the @2x beside it; both are cut from background.svg with `npm run dmg:art`. The window takes the picture's size, 640
  # by 432 with its title bar: a `window` here would be ignored beside a picture. Where the two icons are and how large
  # is the picture's too, since its arrow is drawn between them.
  iconSize: 120
  iconTextSize: 12
  contents:
    - { x: 166, y: 214, type: file }
    - { x: 474, y: 214, type: link, path: /Applications }
