  <circle cx="211.2" cy="179.8" r="470" fill="#f8ead2"/>
  <circle cx="199.5" cy="188.9" r="375" fill="#f7e6c9"/>
  <circle cx="188.9" cy="196.9" r="290" fill="#f5e1bf"/>
  <circle cx="179.6" cy="204.1" r="215" fill="#f4dcb4"/>
